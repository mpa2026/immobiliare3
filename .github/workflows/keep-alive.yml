name: Keep Supabase Alive

on:
  schedule:
    # Esegue ogni 3 giorni alle 8:00 UTC (più frequente per sicurezza)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permette esecuzione manuale

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (attività reale sul DB)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://svsyczdpwdpveqxpvsjr.supabase.co/rest/v1/immobili?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Risposta Supabase: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Supabase attivo - query al DB riuscita"
          else
            echo "⚠️ Risposta inattesa: $response"
            exit 1
          fi
