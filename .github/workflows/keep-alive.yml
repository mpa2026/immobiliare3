name: Keep Supabase Alive

on:
  schedule:
    # Esegue ogni 5 giorni alle 8:00 UTC
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Permette esecuzione manuale

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://svsyczdpwdpveqxpvsjr.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Risposta Supabase: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Supabase attivo"
          else
            echo "⚠️ Risposta inattesa: $response"
          fi
